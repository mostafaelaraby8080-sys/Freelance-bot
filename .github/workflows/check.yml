name: check-jobs

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: check-jobs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run one check
        run: python run_once.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          FREELANCER_PROFILE: ${{ secrets.FREELANCER_PROFILE }}

      - name: Save seen jobs
        run: |
          git config user.name "freelance-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.db
          git diff --cached --quiet || (git commit -m "update seen jobs" && git push)

          jobs:
            check:
              runs-on: ubuntu-latest
              timeout-minutes: 15  # هيوقف العملية تلقائياً بعد 15 دقيقة بدل ما تعلق
